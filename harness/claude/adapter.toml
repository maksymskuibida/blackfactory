# The harness adapter data (C-24, D-51): what the engine knows of the Claude Code harness.
# `crates/bf/build.rs` compiles this file into the binary; nothing is read from it at run time.
# A path that starts with `~/` is under the account's home from the account database (C-3).

# The folder where the harness writes one file for each running session, and the file's name form.
session_dir = "~/.claude/sessions"
session_file = "<pid>.json"

# The keys of a session file.
key_pid = "pid"
key_proc_start = "procStart"
key_session_id = "sessionId"

# The harness's variable that names the session when the walk up the process ancestry finds no
# file (D-51); the engine's own `BF_SESSION` is read only after it and is not adapter data.
fallback_variable = "CLAUDE_CODE_SESSION_ID"

# The harness's own configuration variable.
config_variable = "CLAUDE_CONFIG_DIR"

# The fields of a subagent's hook payload.
subagent_fields = ["agent_id", "agent_type", "parent_tool_use_id", "subagent", "agent_name"]

# The programs that are the harness itself.
programs = ["claude"]

# The folder of the harness's transcripts.
transcript_dir = "~/.claude/projects"

# The forms of the command with which the human says that they are absent (R-72, D-93). A message whose
# whole text is one of them, recorded by the hook as the human's, sets the run's flag.
absent_commands = ["/factory:human-absent"]

# The forms a started session's first message begins with: the brief another session gives it (D-94).
nested_forms = [
  "Task (from the session that started this one):",
  "Background (from the session that started this one):",
]

# The permission modes of the harness in which a tool asks the human before it runs.
ask_modes = ["default", "plan", "acceptEdits"]

# The tools that ask the human a question (R-74, D-96): each with the input field that makes a call of
# it a question; a tool with no field asks whenever it is called. The desktop app's next-step box asks
# only when its `ask` field is set.
question_tools = [
  { tool = "AskUserQuestion" },
  { tool = "mcp__ccd_turn__wrap_up", field = "ask" },
]

# The tools that enter or leave plan mode: leaving it waits for the human's approval.
plan_tools = ["EnterPlanMode", "ExitPlanMode"]

# The tools that ask the human for access to the computer, to an app or to a folder.
access_tools = [
  "mcp__computer-use__request_access",
  "mcp__computer-use__request_full_control",
  "mcp__computer-use__request_teach_access",
  "mcp__ccd_directory__request_directory",
]

# The tools that run a command line or a script, each with the input field that carries it (a tool
# with no field: every text of its input). The guard judges the text as it judges a shell command.
command_tools = [
  { tool = "mcp__terminal__run_in_terminal", field = "command" },
]

# The tools that type into an app or send a message to a session, or start one. The guard refuses a
# call whose text holds a command form of the human-absent flag. Each text of the input counts.
input_tools = [
  { tool = "mcp__computer-use__type" },
  { tool = "mcp__computer-use__app_type" },
  { tool = "mcp__computer-use__app_batch" },
  { tool = "mcp__computer-use__computer_batch" },
  { tool = "mcp__computer-use__teach_batch" },
  { tool = "mcp__computer-use__write_clipboard" },
  { tool = "mcp__ccd_session_mgmt__send_message" },
  { tool = "mcp__ccd_session__start_session" },
  { tool = "mcp__ccd_session__spawn_task" },
  { tool = "mcp__ccd_session__hand_off_to_session" },
]
