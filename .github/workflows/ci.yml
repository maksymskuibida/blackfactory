name: ci

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
      - name: Configure git for the tests
        run: |
          git config --global user.name "ci"
          git config --global user.email "ci@example.invalid"
          git config --global init.defaultBranch main
      - name: Harness instructions stay under 500 lines
        run: |
          lines=$(find harness/claude/skills harness/claude/agents -type f -exec cat {} + | wc -l)
          echo "harness instruction lines: $lines"
          test "$lines" -le 500
      - name: Format
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Install nextest
        uses: taiki-e/install-action@nextest
      - name: Test
        run: cargo nextest run --locked --profile ci
      - name: Documentation tests
        run: cargo test --locked --doc
      - name: Timing tests
        run: "cargo nextest run --locked --profile extended --no-fail-fast -E 'test(/^timing::/) | test(/(^|::)timing_/) | test(=controls::the_sandbox_costs_a_little_and_the_policy_can_switch_it_off)' --no-capture"
      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Desktop panel (validate, test, tokens in step)
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.323
          claude plugin validate harness/claude/panel
          claude plugin test harness/claude/panel
          python3 views/dev/build.py --check
