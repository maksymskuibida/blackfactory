[package]
name = "bf"
description = "Black Factory engine: records, ledger, evidence and gates for agent-built software"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# All files in tests/ build into one test program, `all`; build.rs lists them as modules.
autotests = false

[[test]]
name = "all"
path = "tests/all.rs"

[features]
# The test seam (C-3): off by default, asked for by no release build or install.
test_seam = []

[lib]
name = "bf"
path = "src/lib.rs"

[[bin]]
name = "bf"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
# The build of the tests turns the test seam on (C-3), so the seam tests run in every test run; a
# release build or an install builds no dev-dependency and never has it. The feature is not default.
bf = { path = ".", features = ["test_seam"] }

[build-dependencies]
toml = "0.9"
