[package]
name = "bf"
description = "Black Factory engine: records, ledger, evidence and gates for agent-built software"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
name = "bf"
path = "src/lib.rs"

[[bin]]
name = "bf"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
