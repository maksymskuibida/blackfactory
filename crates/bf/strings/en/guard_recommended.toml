# Strings of the guard once a file list is a recommendation (D-115, D-116).

"guard_recommended.protected.step" = "Change only files inside your working copy that are not protected."
"guard_recommended.protected.worked" = "The path is a file of your working copy outside the protected paths."
"guard_recommended.outside.step" = "Write only inside your working copy."
"guard_recommended.whole.because" = "{part} would {verb} {abs}, the whole working copy, and with it files you did not name"
"guard_recommended.whole.step1" = "Name the files you mean, for example `rm src/old.rs`."
"guard_recommended.whole.step2" = "To discard your own changes use `git restore <file>` on a file you changed."
"guard_recommended.whole.worked" = "The command names files inside your working copy, not the working copy itself."
"guard_recommended.checkout.because" = "a checkout of a branch, a revision or a new branch moves the whole working copy, the protected files with it; only the engine joins branches (`bf unit land`)"
"guard_recommended.idle.because" = "the working copy of {id} is not at work: its unit has landed or is parked, so nothing is written in it"
"guard_recommended.idle.step" = "Write inside the working copy of your own unit."
"guard_recommended.idle.worked" = "The path starts with the folder of a working copy that is at work."
"guard_recommended.foreign.because" = "you do not work in the working copy of {id} (you work in {base}), so only the files its list names may be written there"
"guard_recommended.foreign.step" = "Write inside your own working copy."
"guard_recommended.foreign.worked" = "The path starts with the folder of your own working copy."
"guard_recommended.link.step1" = "Change files with the editing tools, inside your working copy."
"guard_recommended.link.step2" = "Name each path on the command line; `git hash-object -w` and `git add <file>` stay open."
"guard_recommended.link.worked" = "The command names only paths inside your working copy and makes no link."
"guard_recommended.gitenv.because" = "a git environment variable (GIT_DIR, GIT_WORK_TREE, GIT_INDEX_FILE and the like) points git at another repository, index or object store, and hides what is being changed"
"guard_recommended.gitenv.step" = "Run git in the working copy without these variables."
"guard_recommended.gitenv.worked" = "The command sets none of the git location variables."
"guard_recommended.gitenv.refused" = "point git at another repository, index or object store with an environment variable"
"guard_recommended.apply.because" = "a patch writes the files it names, a link or a changed mode among them, and the guard does not read the patch; make the change with the editing tools (`git apply --check` and `--stat` stay open)"
"guard_recommended.lookalike.because" = "a name part with a character that folds to an ASCII letter (a long s, the Kelvin sign, a ligature) is the same file as its ASCII look-alike on a volume that folds case, so it can name a protected file"
"guard_recommended.lookalike.step" = "Name the file in plain ASCII."
"guard_recommended.lookalike.worked" = "Every part of the path is ASCII, or has no character that folds to an ASCII letter."
"guard_recommended.outside_project.because" = "you work in {base}; a write outside the project could change the harness settings, the git config or the shell start-up files that every later session loads"
"guard_recommended.outside_project.step" = "Write inside your working copy, or in the system's scratch folder for a temporary file."
"guard_recommended.outside_project.worked" = "The path starts with your working copy's folder or a scratch folder."
"guard_recommended.git.option" = "from a working copy git runs with no `-c`, `--config-env`, other `-C` folder or output option; they change what git reads or writes where the guard does not look"
"guard_recommended.git.pathspec" = "a path given to git here must be one literal file of the copy: no pathspec magic, glob, folder, root or `..`; git expands those itself and they can reach protected files"
"guard_recommended.git.sub" = "`git {sub}` from a working copy may rewrite the tree, the index, the config or the refs where the guard does not look; only the read-only forms, `add`, `commit` and `checkout`, `restore` and `reset` on literal paths run here"
"guard_recommended.git.reset" = "a reset in a working copy may only go to HEAD; any other revision puts files into the tree that the guard cannot judge"
"guard_recommended.checkout.because_plain" = "in a working copy a checkout is `git checkout [HEAD] -- <literal paths>` only; without `--` git reads a word as a revision whatever file has that name, and a revision moves the whole tree, the protected files with it"
"guard_recommended.cd.because" = "a session that works outside the working copies would stand where the builder of that copy stands and write as freely; only the builder of a copy works in it"
"guard_recommended.cd.step" = "Read the working copy by its path, for example `cat .bf/work/U-1/src/a.rs`."
"guard_recommended.cd.worked" = "The command changes into no working copy."
