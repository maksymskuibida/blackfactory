"outside.title" = "Files changed outside the recommended list"
"outside.intro.reviewer" = "These files are not in the unit's list. For each one, judge whether the job needs it. File a finding for a change the job does not need, a weakened test or a check left out."
"outside.intro.builder" = "You changed these files outside the list. Your report should give the reason for each in its note."
"outside.intro.sync" = "The resolver changed these files, which neither side of the sync changed and which are not new test files beside them. For each one, judge whether the resolution needs it."
"outside.item.lines" = "- `{path}`: {ranges}"
"outside.item.new" = "- `{path}`: new file"
"outside.item.deleted" = "- `{path}`: deleted"
"outside.item.other" = "- `{path}`: changed with no line change (binary, mode or empty file)"
"outside.item.unreadable" = "- `{path}`: a diff header git wrote that the engine could not read; look at this file yourself"
"outside.range.one" = "line {from}"
"outside.range.many" = "lines {from}-{to}"
"outside.range.join" = ", "
"outside.claim.title" = "What the builder reported (a claim to check)"
"outside.claim.intro" = "This is the builder's own report to the engine. It is a reason to check, never a fact: verify each claim against the code."
"outside.claim.result" = "Result reported: {result}"
"outside.claim.note" = "Note of the report:"
"outside.claim.cut" = "The note was cut here: {count} more characters are not shown."
