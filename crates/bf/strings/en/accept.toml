# Strings of the group `accept`: the human's accept of findings on a parked review, the low phase of a checkpoint fix, and the checks a second round does not run again (R-71, D-89).
"accept.fix.what" = "accept findings of the fix of {k}"
"accept.fix.check" = "`bf status` shows the findings of the fix of {k} accepted, and the fix gone on."
"accept.fix.none_open" = "no fix of this checkpoint is open"
"accept.fix.step_status" = "`bf status` shows what the checkpoint waits for."
"accept.fix.not_waiting" = "the fix is in `{phase}`; its findings are accepted while the human is asked about them (phase `low` or `parked`)"
"accept.fix.step_next" = "`bf next` shows what the fix waits for."
"accept.fix.unknown" = "{id} is not an open finding of the fix's review"
"accept.fix.none_named" = "no finding was named"
"accept.fix.step_open" = "Name open findings of the fix's review, as `f<round>.<number>`; the open ones are {open}."
"accept.fix.only_accept" = "findings of a fix's review are accepted, not declined"
"accept.fix.only_accept.step" = "Run `bf checkpoint finding {k} --accept <ids> --quote \"<the human's words>\"`."
"accept.fix.mixed" = "the ids name findings of the fix's review (`f1.2`) and of the checkpoint's own review (`r1.2`) together"
"accept.fix.mixed.step" = "Run the command once for each kind of finding of {k}."
"accept.fix.low.reason" = "the review of the fix filed low findings only: the human accepts them or has them fixed"
"accept.fix.low.note" = "The review of the fix of {k} filed low findings only: {ids}. They do not hold the checkpoint back. The human accepts them in their own words, or has them fixed by the builder."
"accept.fix.low.accept_command" = "bf checkpoint finding {k} --accept {ids} --quote \"<the human's words>\""
"accept.fix.low.release_command" = "bf checkpoint fix {k} --release --quote \"<the human's words>\""
"accept.fix.low.report.what" = "report on the fix of {k}"
"accept.fix.low.report.because" = "the fix waits for the human to accept or fix the low findings of its review"
"accept.fix.low.report.step" = "`bf next` gives `decide-low-findings`; the human accepts them (`bf checkpoint finding {k} --accept <ids> --quote \"...\"`) or has them fixed (`bf checkpoint fix {k} --release --quote \"...\"`)."
"accept.fix.low.report.check" = "`bf status` shows the fix back at work or done."
"accept.checks.skip" = "{check} of {k} passed on this content already: the receipt {receipt} stands and the check is not run again"
"accept.report.now" = "{unit} is now {state}"
"accept.report.no_state" = "{unit} was reported on"
"accept.fix.hold_what" = "accept findings"
"accept.fix.over_rounds" = "more than {max} review rounds"
"accept.fix.release.what" = "release the fix of {k}"
"accept.fix.release.because" = "it is `{phase}`; only a fix that is parked or waits on low findings is released"
"accept.fix.release.check" = "`bf status` shows the fix back at work."
"accept.fix.release.hold_what" = "release the fix"
"accept.fix.settled.note" = "Every finding of the review of the fix of {k} is accepted, so the review is settled: no further round. Report `built` to go on to the checks and the end of the fix."
"accept.fix.settled.command" = "bf report {k} --result built"
"accept.fix.settled.what" = "report on the settled fix of {k}"
"accept.fix.settled.because" = "every finding of its review is accepted; a `{result}` report does not fit, only `built` goes on"
"accept.fix.settled.check" = "`bf status` shows the fix done, or back at work if a check failed."
"accept.pick.what" = "fix findings of {k}"
"accept.pick.because" = "a critical, high or medium finding is picked to be fixed, and that is the human's choice in their own words; no earlier words of the human for these findings were found, from a fix of them that was aborted"
"accept.pick.step" = "Ask the human, then run the command again with `--quote \"<the words of their message>\"`."
"accept.pick.check" = "The command opens the fix."
"accept.pick.hold_what" = "fix findings"
"accept.events.ignored.reopen" = "event {seq}: a fix reopened with the human's earlier words that cites no counted opening of these findings by the human that an abort has ended since, or is written while a fix or a sync is at work or the human is not being asked"
