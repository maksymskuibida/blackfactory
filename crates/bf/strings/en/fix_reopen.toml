# Strings of the group `fix.reopen`: opening a checkpoint fix again for a failed check, and the fix of a
# failed format or lint check that finishes with no review round (R-70, D-89, D-62). Keys are quoted and flat.

"cli.ckfix.open.done" = "{k}: a fix opened for {checks}"
"cli.ckfix.open.what" = "open a fix of {k}"
"cli.ckfix.open.fix_open" = "a fix of {k} is already open"
"cli.ckfix.open.sync_open" = "a sync is open"
"cli.ckfix.open.no_checkpoint" = "there is no such checkpoint"
"cli.ckfix.open.not_landed" = "its units have not all landed, or it is closed"
"cli.ckfix.open.none_failed" = "no check of {k} failed on its current content"
"cli.ckfix.open.unreachable" = "a check of {k} could not run at all; the human decides that one"
"cli.ckfix.open.step_status" = "`bf status` shows an open fix, `bf next` shows what the checkpoint waits for."
"cli.ckfix.open.worked" = "`bf next` offers the fix to a builder."
"cli.ckfix.open.needs" = "it needs --abort, --release or --open"
"cli.ckfix.open.needs_step" = "Run `bf checkpoint fix <K> --open`, `bf checkpoint fix <K> --abort`, or `bf checkpoint fix <K> --release --quote \"<the human's words>\"` for a parked fix."

"cli.ckfix.lint.finished" = "the fix of {k} is only format or lint work and every change is accounted for: no review round is needed"

"cli.ckfix.format.refused" = "{path}: not accepted as format only: {why}"
"cli.ckfix.format.stale.what" = "report the fix of {k}"
"cli.ckfix.format.stale.because" = "{path} was accepted as format only and no longer equals the content that was accepted"
"cli.ckfix.format.stale.step" = "Put {path} back to its content from before the fix, commit, and report again; the engine proves it again."
"cli.ckfix.format.stale.check" = "`bf status` shows the fix in review."
"cli.ckfix.format.reviewer" = "## Accepted as format only\n\nThe engine ran the formatter on each file below as it was before the fix, and the result is the file as the fix leaves it. Each carries the mark `{mark}`: it is not a gap, and its change need not be read as more than formatting.\n\n"
"cli.ckfix.format.save_failed" = "the fix could not record the files accepted as format only: {why}"

"cli.ckfix.abort.done" = "{k} is as it was before the fix"
"cli.ckfix.release.done" = "the fix of {k} is back with its builder"
"cli.ckfix.settle.what" = "settle the fix of {k}"
"cli.ckfix.settle.none_open" = "no fix is open for it"
"cli.ckfix.settle.step_status" = "`bf status` shows an open fix when there is one."
"cli.ckfix.settle.check" = "`bf status` shows no open fix."
"cli.ckfix.open.step_open" = "`bf checkpoint fix <K> --open` opens one for a failed check."
"cli.ckfix.needs.what" = "run `bf checkpoint fix {k}`"
"cli.ckfix.needs.check" = "The command prints the result."
"cli.ckfix.outside.not_test" = "{path} is outside the files of {k}'s units and is not a new test file"
"cli.ckfix.outside.units" = "{path} is outside the files of {k}'s units"
"cli.ckfix.done.reviewed" = "Reviewed clean and the checkpoint's checks passed again."
"cli.ckfix.done.no_review" = "Finished with no review round, and the checkpoint's checks passed again."
"cli.ckfix.format.page" = "Accepted as format only: {files}."
"cli.ckfix.format.checkpoint" = "## Files a fix changed\n\n{rows}\n"
"cli.ckfix.format.checkpoint_row" = "- {fix}: `{path}`{mark}\n"
"cli.ckfix.format.checkpoint_mark" = ", marked {mark}: the engine ran the formatter on the file as it was before the fix and the result is the file as the fix leaves it, so it is not a gap"
