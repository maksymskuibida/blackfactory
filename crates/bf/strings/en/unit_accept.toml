# Strings of the group `unit_accept`: the human's accept of the findings of a parked unit (R-71, H-24).
"cli.unit_accept.what" = "accept findings of {unit}"
"cli.unit_accept.no_unit" = "that unit has not been started"
"cli.unit_accept.no_unit.step" = "Use a unit ID from `bf status`."
"cli.unit_accept.not_parked" = "it is `{state}`; only a unit whose review is parked or used its rounds has findings to accept"
"cli.unit_accept.not_parked.step" = "`bf next` shows what the unit is waiting for."
"cli.unit_accept.not_review" = "it is parked while it was `{prev}` ({reason}), not in its review; the work since the last review has no reviewer's word"
"cli.unit_accept.not_review.step" = "Release it with `bf unit release {unit} --quote \"<the human's words>\"` so the builder goes on and a review follows."
"cli.unit_accept.none_named" = "no finding was named"
"cli.unit_accept.none_named.step" = "Name the findings: `bf unit accept {unit} <F-ids> --quote \"<the human's words>\"`; the open ones are {open}."
"cli.unit_accept.unknown" = "{ids} is not an open finding of {unit}"
"cli.unit_accept.unknown.step" = "Name only open findings of the unit; they are {open}."
"cli.unit_accept.subcommands" = "`start`, `land`, `release`, `unblock`, `scope`, `pause`, `resume`, `accept`, `restore`, `format` or `sync`"
"cli.unit_accept.usage" = "Use `bf unit start <U>`, `land <U>`, `release <U> --quote \"...\"`, `unblock <U> --why \"...\" [--wait|--human]`, `scope <U> --revert <n>`, `pause <U>`, `resume <U>`, `accept <U> <F-id>... --quote \"...\"`, `restore <U> <path>...`, `format <U> <path>...` or `sync <U>`."
"cli.unit_accept.worked" = "`bf status` shows {unit} as reviewed and `bf next` offers its landing."
"cli.unit_accept.line" = "{unit}: accepted {ids} ({state})"
