# Strings of the group `evidence`: keys are quoted and flat, `"cli.evidence.some.key" = "text"`.
# Filled by the unit that owns this group (D-62).
"cli.evidence.plan.unit_without_tests" = "{unit} neither names its `tests` nor says in `full_suite` why it runs the whole suite"
"cli.evidence.plan.heavy_without_limit" = "the plan holds heavy checks ({checks}) and states no `heavy_limit`: put the record PL-1 (kind plan_settings) in the plan with a whole number of at least 1"
"cli.evidence.counted" = "{check} counts the run {from} of {source}: the same command on the same content, so it runs once"
"cli.evidence.failed.tests" = "{check}: {count} failing test(s):"
"cli.evidence.failed.test" = "  FAIL {name}"
"cli.evidence.failed.output" = "The whole output is kept in {path}"
"cli.evidence.heavy.waits" = "{check} is heavy and waits for a place: the plan allows {limit} at once, held by {holder}"
"cli.evidence.heavy.waits_long" = "{check} has waited more than ten minutes for a place held by {holder}"
"cli.evidence.order.refused" = "run {check}"
"cli.evidence.order.because" = "{earlier} comes before it in the list of checks every unit must pass and has no passing receipt on this content"
"cli.evidence.order.do_this.1" = "Run {earlier} first through `bf evidence run`; the unit's brief gives its exact line."
"cli.evidence.order.worked_when" = "{earlier} has a passing receipt on this content, and this run is accepted."
"cli.evidence.plan.later_without_needs" = "note: {check}, a later check of {unit}, names no `needs`, so nothing makes it wait for the checks before it"
"cli.evidence.plan.tests_operator" = "{unit}: its `tests` hold `{word}`, which a check's command cannot use: write one program and its arguments, run without a shell"
"cli.evidence.plan.close_without_suite" = "{checkpoint} holds {unit}, which runs its own tests, and lists no check that runs the suite ({suite}) when the checkpoint closes"
"cli.evidence.heavy.timeout" = "the heavy check ran longer than its limit of {seconds} seconds and was stopped; its place is free again"
"cli.evidence.heavy.holder" = "pid {pid} ({intent}, {check})"
"cli.schema.plan_settings.id" = "the plan settings record has the one ID `PL-1`"
"cli.schema.plan_settings.heavy_limit" = "`heavy_limit` must be a whole number of at least 1"
"cli.schema.unit.tests_and_full_suite" = "a unit names `tests` or says `full_suite`, never both"
"cli.schema.list.bad_kind" = "an entry of `{list}` has a `kind` that is not format, lint or suite"
"cli.schema.list.bad_heavy" = "an entry of `{list}` has a `heavy` that is not true or false"
"cli.schema.list.two_suites" = "at most one entry of `{list}` is the suite"
"cli.evidence.brief.rule.checks_engine" = "Never run the command of a required check by hand: run it only through `bf evidence run`. Use a narrow command by hand only to debug a failing test the engine run named. A unit that names its tests runs them in the suite's place."
"cli.evidence.brief.rule.reviewer_receipts" = "You read the receipts and do not run the suite again."
"cli.ckfix.probe_missing.what" = "report the fix of {k}"
"cli.ckfix.probe_missing.because" = "a probe that exposed a fault is not yet a permanent test that passes: {n}"
"cli.ckfix.probe_missing.step" = "Add each probe to the suite as a permanent test with its expected answer, commit it, then report again."
"cli.ckfix.probe_missing.check" = "`bf status` shows the fix in review."
"cli.checks.unit.question.note" = "A checkpoint or a single unit may override the list in the plan, with a reason; the plan page shows every override."
"cli.checks.unit.question.note_tests" = "A unit that names its tests runs them in the suite's place."
