# The human-absent flag (R-72, D-93, D-94): what the hook says when the flag is set, kept, asked about
# and released, and the words the engine reads.

"absent.release_word" = "yes"
"absent.answer_yes" = "yes"
"absent.answer_stay" = "stay absent"
"absent.release_question" = "You wrote to the run while the human-absent flag is on. Are you back? Answer `{yes}` to end the flag, or `{stay}` to keep it on."

"absent.set.human" = "The human-absent flag is now on for this run. The build goes on to the next human stop without waiting for you, makes no design change, and the judge may reshuffle the unit plan inside strict checks. It ends only when you write a message in a conductor session of this run and then answer `{yes}` to the question that follows."
"absent.set.mode" = "This session's permission mode is `{mode}`: a tool that asks before it runs waits for you here. Switch to a mode that does not ask if you want the build to go on unattended."
"absent.set.amendments" = "Open amendments that wait for you (no plan repair can open while one is open): {list}."
"absent.set.checkpoint" = "The checkpoint in hand is {checkpoint}."
"absent.set.no_checkpoint" = "No checkpoint is in hand."
"absent.set.waits" = "Still waits for you while you are away: the approval of a design gate or an amendment, the close and merge of a checkpoint, the decision on a parked unit, and any finding the judge may not accept."
"absent.set.limits" = "The command is kept from agents only as far as the guarded tools reach: a tool that no list names passes the guard unseen, and an agent that you gave control of the harness's own app can type the command into its prompt, which the hook cannot tell from you."
"absent.set.conductor" = "The human is absent: they typed the command in a conductor session of this run. Go on with `bf next` and keep working to the next human stop. Do not wait for the human, make no design change, and when they return answer their message and ask the release question in the same turn."
"absent.stay.human" = "The human-absent flag is fully on again: every mark of your return is cleared."
"absent.stay.conductor" = "The human sent the command again: they are still absent. The flag is fully on again. Go on with `bf next`."
"absent.ask.conductor" = "The human wrote while the flag is on, so it is returning in this session. Answer the message, and in the same turn ask this question as one line with the one answer `{yes}` (the one button of the next-step box where the app has one, else the ask menu with the answers `{yes}` and `{stay}`): {question}"
"absent.release.human" = "The human-absent flag is off. The run waits for you again."
"absent.release.conductor" = "The human is back and the flag is off. Report what was done, what waits for the human and everything judged for them while they were away, the repairs and the accepted findings. The instruction to work unattended no longer holds."
"absent.nested.human" = "The human-absent flag is handled in the run's conductor session: nothing is marked or released from this session."
"absent.refused.disabled" = "The command sets nothing: the policy has `enabled = false` in its `[absent]` section."
"absent.refused.nested" = "The command sets nothing in a session that another session started; type it in the run's conductor session."
"absent.refused.rejected" = "The command sets nothing: the hook did not take the message as one the human typed ({reason})."
"absent.refused.longer" = "The command sets nothing inside a longer message; send it alone."
"absent.refuse.what" = "run `bf absent` with this subcommand"
"absent.refuse.why" = "only `bf absent status` exists: no command sets or releases the flag, only the human's own message in a conductor session of the run does"
"absent.refuse.step" = "Run `bf absent status` to read the flag."
"absent.refuse.worked" = "`bf absent status` prints the flag of the run."
"absent.status.off" = "The human-absent flag is off."
"absent.status.on" = "The human-absent flag is on since {since}, set in session {session}."
"absent.status.returning" = "Returning in: {sessions}."
"absent.status.not_returning" = "Returning in no session."
"absent.status.stay" = "Last stay: {at} in session {session}."
"absent.status.release" = "Last release: {at} in session {session}."
