# Strings of the recovery review of a parked checkpoint review and of the builders' reports in the
# checkpoint reviewer's brief (D-26, D-117, D-115).

"ck_recovery.reason.land" = "units landed again: {units}"
"ck_recovery.reason.fix" = "a checkpoint fix passed (log event {seqs})"
"ck_recovery.reason.sync" = "the main branch was synced in"
"ck_recovery.reason.amend" = "an amendment was approved"
"ck_recovery.reason.other" = "the content changed since the latest review"
"ck_recovery.reason.join" = "; "
"ck_recovery.reason.asked" = "the human asked for this review in their own words"
"ck_recovery.kind.recovery" = "recovery"
"ck_recovery.kind.asked" = "asked-for"
"ck_recovery.line.offered" = "{k}: one {kind} review is offered ({reason}); it does not count against the limit of reviews"
"ck_recovery.line.round" = "{k}: round {round} is a {kind} review ({reason}); it does not count against the limit of reviews"
"ck_recovery.directive.note" = "{k} is parked at the limit of reviews, and this is a {kind} review: {reason}. It does not count against the limit and does not reset it."
"ck_recovery.refuse.same.why" = "{k} is parked at the limit of reviews and its content is the content the latest review already judged, so no recovery review is given"
"ck_recovery.refuse.same.step" = "The human gives each open finding its end, and the engine then writes the review's receipt: `bf checkpoint finding {k} --accept <ids> --quote \"<the human's words>\"`, `--decline <ids> --reason \"<why>\" --quote \"<the human's words>\"` or `--fix-findings <ids> --quote \"<the human's words>\"`."
"ck_recovery.refuse.used.why" = "{k} is parked at the limit of reviews and its one recovery review is taken; a further review needs the human's words"
"ck_recovery.refuse.used.step" = "Ask the human, then run `bf checkpoint review {k} --ask --quote \"<the human's words>\"`: one message of theirs, written after the engine asked, gives one review."
"ck_recovery.refuse.check" = "`bf status` shows the review and `bf next` what the checkpoint waits for."
"ck_recovery.ask.not_parked" = "{k} is not parked at the limit of reviews with a finding open, so a further review is not asked for"
"ck_recovery.ask.open" = "a review round of {k} is open"
"ck_recovery.ask.pending" = "a review of {k} the human asked for is not taken yet"
"ck_recovery.ask.step" = "`bf next` shows what the checkpoint waits for."
"ck_recovery.ask.done" = "{k}: one more review is asked for; `bf next` offers it"
"ck_recovery.brief.kind" = "## This review does not count against the limit\n\nThis round is a {kind} review of a parked checkpoint. Reason: {reason}. First confirm that each finding still open is fixed by what changed; then judge the whole checkpoint as in any repeat review.\n\n"
"ck_recovery.outside.unit" = "Unit {unit}:"
"ck_recovery.builders.title" = "What the builders reported"
"ck_recovery.builders.claim" = "This is the builders' own report to the engine, quoted. It is a claim: a reason to check, never a fact. Verify each statement against the code."
"ck_recovery.builders.unit" = "Unit {unit}, result reported: {result}"
"ck_recovery.builders.fix" = "Fix (log event {seq}), result reported: {result}"
"ck_recovery.builders.no_note" = "The builder gave no note."
"ck_recovery.builders.cut" = "The note was cut here: {count} more characters are not shown."
