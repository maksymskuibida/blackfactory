# Strings of the audits of a checkpoint (R-77, D-159, D-62): the brief an auditor is given, the refusals of
# its brief and report, the lines of its receipt and of the close.

"ck_audit.what.brief" = "brief {k} for the audit {check}"
"ck_audit.what.report" = "report the audit {check} of {k}"
"ck_audit.refuse.no_source.why" = "{check} is no audit source of {k}: only an agent check of the checkpoint that judges the built result is audited this way"
"ck_audit.refuse.no_source.step" = "`bf next` lists the audits of {k}, each with its role and its command."
"ck_audit.refuse.role.why" = "the audit {check} of {k} is the work of the role {want}, not of {role}"
"ck_audit.refuse.role.step" = "Use `bf brief {k} --role {want} --check {check}`."
"ck_audit.refuse.busy.why" = "a sync or a fix of {k} is open, and no audit starts while it is"
"ck_audit.refuse.busy.step" = "`bf next` shows what the checkpoint waits for."
"ck_audit.refuse.review.why" = "the checkpoint review of {k} has not passed at the content now in its working copy, and an audit follows it"
"ck_audit.refuse.review.step" = "`bf next` gives the reviewer's directive for {k}."
"ck_audit.refuse.closed.why" = "{k} is closed or its units have not all landed"
"ck_audit.refuse.closed.step" = "`bf next` shows what the checkpoint waits for."
"ck_audit.refuse.check" = "`bf next` shows the audits of the checkpoint."
"ck_audit.refuse.result.why" = "an auditor reports `findings`, with the findings or none for a clean audit"
"ck_audit.refuse.result.step" = "Use `bf report {k} --role {role} --check {check} --token <token> --result findings --findings -`."
"ck_audit.refuse.token.why" = "a report needs the token of the directive of the audit {check}; none, or the wrong one, was given (the token of another role does not serve)"
"ck_audit.refuse.token.step" = "Pass the token of the audit directive of {k} for {check} with `--token`."
"ck_audit.refuse.no_round.why" = "no round of the audit {check} is open"
"ck_audit.refuse.no_round.step" = "Run `bf brief {k} --role {role} --check {check}`: it opens the round."
"ck_audit.refuse.content.why" = "the content of {k} changed since the round opened, so the round judged other content"
"ck_audit.refuse.content.step" = "Run `bf brief {k} --role {role} --check {check}` again: it opens a new round on the content now in the checkpoint."
"ck_audit.refuse.step.why" = "the step {step} failed at this content and no entry of the report names it in `step`"
"ck_audit.refuse.step.step" = "Give an entry whose `step` is `{step}`, with its title, severity, where and action."

"ck_audit.covered.cold" = "the whole checkpoint, cold"
"ck_audit.covered.repeat" = "the whole checkpoint, the report of round {round} with what became of each finding, and what changed since round {round}"

"ck_audit.brief.title" = "# Brief: {k} as {role} (audit {check}, round {n})"
"ck_audit.brief.checkpoint" = "Checkpoint: {title}"
"ck_audit.brief.intro" = "You audit the whole built result of the checkpoint for the check {check} ({check_title}). Round {n} covers: {covered}."
"ck_audit.brief.diff" = "## The whole diff\n\nThe full diff is in `{path}`. Read it all, and read beyond it whenever you need to. The working copy of the checkpoint is `{wc}`: read and run in it, change nothing in it."
"ck_audit.brief.check" = "## The check\n\n{id} ({title}) proves: {proves}."
"ck_audit.brief.proves" = "## What the check proves"
"ck_audit.brief.acceptance" = "  - Acceptance: {text}"
"ck_audit.brief.units" = "## The brief of every unit on this checkpoint"
"ck_audit.brief.earlier" = "## The earlier round of this audit\n\nRound {round} judged content {content}. Each finding is listed with what became of it."
"ck_audit.brief.earlier_none" = "- It filed no finding."
"ck_audit.brief.earlier_finding" = "- r{round}.{number} [{severity}] {title} ({where}): {action}. Outcome: {outcome}"
"ck_audit.brief.since" = "The changes since the content round {round} judged are in `{path}`."
"ck_audit.brief.report" = "## Report\n\nReport with this command, the JSON on its standard input:\n\n`{command}`\n\nThe JSON has `areas`, `findings` and `probes`. Each area is `{{\"area\": \"what you looked at\", \"how\": \"read\"}}`, with `how` one of read, built and run, or probed with a test of its own; a report with no areas is refused. Each finding has `title`, `severity` (critical, high, medium or low), `where` (the file and line) and `action`{step_field}. Each probe has `name`, `meant`, `showed` and, when a finding names it, `file`, `command` and `expect`. A finding goes only into this report: you file no record and attach no outcome. Each entry becomes the finding `r{n}.<number>` of this round and goes the way of a review finding."
"ck_audit.brief.step_field" = ", and `step` (the step it concerns, as `<journey> step <number>`, for a step that failed)"
"ck_audit.brief.rules" = "## Rules\n\n- Never edit anything under `factory/` or `.bf/`.\n- Never run `bf gate`, `bf human-turn`, `git push` or `git merge`.\n- If you cannot judge without the human's decision, ask: `bf ask --title \"<the question>\"`."

"ck_audit.receipt.clean" = "The audit {check} judged the whole of {k} in round {round} and found nothing to fix."
"ck_audit.receipt.low" = "The audit {check} judged the whole of {k} in round {round} and filed no critical, high or medium finding; {count} low finding(s) go to the human."
"ck_audit.receipt.decided" = "The audit {check} judged the whole of {k} in round {round}; the human ended each critical, high and medium finding: {ids}."
"ck_audit.parked.note" = "the checkpoint is parked: the human decides"
"ck_audit.close.open" = "the finding {id} ({sev}: {title}) of the audit {source} is still open and holds the close: `bf next` gives the way on"
