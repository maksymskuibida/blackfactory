"cli.amend.adds_problem.worked_when" = "`bf amend approve` prints the approved amendment."

"cli.amend.unknown.refused" = "run `bf amend`"
"cli.amend.unknown.because" = "unknown subcommand"
"cli.amend.unknown.do_this" = "Use `bf amend open [--repair [--from-design <K-n>]] <ID>...`, `revise <ID>...`, `checkpoint before|after|split <K-n> <U-n>...`, `narrow --file <f>`, `approve`, `judge <A-n> --file <f|-> --token <t> --model <m>` or `withdraw <A-n>`."
"cli.amend.unknown.worked_when" = "The command prints the amendment."
"cli.judge.need_file" = "the verdict file, or `-` for standard input"
