# Strings of the repair judge (R-69, D-90): the token, the verdict, the limits of a go. Keys are quoted and flat.

"cli.amend.approve_repair_what" = "approve {amend} as a plan repair"
"cli.amend.adds_problem.refused" = "approve {amend}"
