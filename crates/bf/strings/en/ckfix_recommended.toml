# Strings of a checkpoint fix once its file list is a recommendation (D-115, D-116, D-117).

"ckfix_recommended.request.what" = "ask for files for the fix of {k}"
"ckfix_recommended.request.because" = "a fix's file list is a recommendation, so nothing is asked for or granted: the fix may change any file of the working copy that is not protected"
"ckfix_recommended.request.step_change" = "Change the file you need, commit it, and go on with the fix."
"ckfix_recommended.request.step_report" = "Give the reason for a file outside the lists in the note of your report: `bf report {k} --role builder --result built --note \"<why>\" --token <token>`."
"ckfix_recommended.request.check" = "`bf status` shows the fix still at work."
"ckfix_recommended.verdict.what" = "give a scope verdict on the fix of {k}"
"ckfix_recommended.verdict.because" = "no fix has a request for files to judge any more"
"ckfix_recommended.verdict.step" = "`bf next` shows what the fix of {k} waits for."
"ckfix_recommended.verdict.check" = "`bf status` shows the fix in its phase."
"ckfix_recommended.brief.list_title" = "Recommended files"
"ckfix_recommended.brief.list_intro" = "These are the files of the checkpoint's units and the test folders. They are a recommendation, not a limit: you may change another file when the fix needs it."
"ckfix_recommended.brief.outside_rule" = "A file outside these lists is judged by the reviewer, who may refuse it with a finding. Give the reason for each such file in the note of your report."
"ckfix_recommended.brief.outside_title" = "Files outside the lists of the checkpoint's units"
"ckfix_recommended.brief.outside_intro" = "The fix changed these files, which lie outside the lists of the checkpoint's units. Judge each one as you would for a unit, and refuse one with a finding when it is not needed."
"ckfix_recommended.brief.outside_file" = "- `{path}` lies outside the lists of the checkpoint's units"
"ckfix_recommended.brief.claim_title" = "The builder's claim: a reason to check, never a fact"
"ckfix_recommended.brief.claim_result" = "The builder's latest report said: {result}."
"ckfix_recommended.brief.claim_none" = "The builder gave no note."
"ckfix_recommended.brief.claim_cut" = "(The note was cut at {max} characters.)"
"ckfix_recommended.brief.outside_intro_builder" = "Your change so far touches these files, which lie outside the lists of the checkpoint's units. Give the reason for each in the note of your report; the reviewer may refuse one with a finding."
"ckfix_recommended.brief.outside_file_rule" = "- `{path}` lies outside the lists of the checkpoint's units. Rule: {rule}"
"ckfix_recommended.never.what" = "report the fix of {k}"
"ckfix_recommended.never.because" = "{path} cannot be changed by any fix: {rule}"
"ckfix_recommended.never.step" = "Undo the change to {path} (`git restore` it or revert its commit), commit, then report again."
"ckfix_recommended.never.check" = "`bf status` shows the fix in review."
"ckfix_recommended.fail.repair" = "Repair it, keeping to the files of your brief where you can (a file outside them needs its reason in your report), commit, run the failing checks again with `bf evidence run`, then report again."
"ckfix_recommended.brief.judge" = "## What to judge\n\nDoes the fix solve the failure without weakening a test? Look at how each probe test was added to the suite: it must be in the suite and run, not compiled out, skipped or emptied, and its command must run at least one test. The lists of the checkpoint's units are a recommendation: judge whether each change outside them is needed for the fix and does not stray into other work, and refuse one that is not with a finding. Report with `bf report {k} --role reviewer --result findings --findings -` (a JSON list of `{{title, severity, where, action}}`), or `--result built` when the fix is right. Pass the token of your directive with `--token`."
