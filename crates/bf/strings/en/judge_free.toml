# Strings of the free reshuffle's script rules (R-73, D-95) and of the removal of a unit record. Keys are quoted and flat.

"judge.free.kind" = "{id}: a record of kind {kind} changes, and a free reshuffle changes only units, handoffs, checks and checkpoints"
"judge.free.waive" = "{id}: a waive of this record is not allowed in a free reshuffle"
"judge.free.check_removed" = "{id}: a check in force is removed"
"judge.free.check_field" = "{id}: a check in force changes its field {field}"
"judge.free.check_unit_stays" = "{id}: the unit check moves away from {unit}, which stays in the plan"
"judge.free.check_unit_missing" = "{id}: the unit check moves to {unit}, which is not in the plan"
"judge.free.check_unit_delivers" = "{id}: the unit check moves to {unit}, which does not deliver {items}, what the check proves"
"judge.free.check_unit_later" = "{id}: the unit check moves to {unit} of {now}, a later checkpoint than {was}, where it was"
"judge.free.check_added_kind" = "{id}: an added check is not a command check of scope unit"
"judge.free.check_added_unit" = "{id}: an added check is for {unit}, which is not a unit this repair adds"
"judge.free.check_added_proves" = "{id}: an added check proves {items}, which {unit} does not deliver"
"judge.free.command.program" = "{who}: the command is not of a program whose test names the plan check reads (cargo test or cargo nextest run)"
"judge.free.command.no_names" = "{who}: the command names no test"
"judge.free.command.shape" = "{who}: the command is not the command of a unit check in force with only its test names changed"
"judge.free.command.name" = "{who}: {name} is no test file that is new in the unit's files or that a check in force names"
"judge.free.command.new_file" = "{who}: the command names no test file that is new in the files of the unit"
"judge.free.checkpoint_operation" = "a checkpoint operation is part of the repair"
"judge.free.checkpoint_added" = "{id}: a checkpoint is added"
"judge.free.checkpoint_removed" = "{id}: a checkpoint is removed"
"judge.free.closed_checkpoint" = "{id}: a closed checkpoint changes"
"judge.free.checkpoint_field" = "{id}: a checkpoint changes its field {field}, and only `after` may change"
"judge.free.checkpoint_empty" = "{id}: the checkpoint is left with no unit in `after`, so the engine would open no review and no close for it and every later checkpoint would wait"
"judge.free.landed_unit" = "{id}: a landed unit changes"
"judge.free.handoff_added" = "{id}: a handoff is added"
"judge.free.handoff_removed" = "{id}: a handoff is removed"
"judge.free.handoff_field" = "{id}: a handoff changes its field {field}, and only `from` and `to` may change"
"judge.free.plan_problem" = "the plan would have a problem that the plan in force does not have: {problem}"
"judge.free.later_checkpoint" = "{unit} of {checkpoint} depends on {dep} of {later}, a later checkpoint"
"judge.free.cover_lost" = "{checkpoint}: the item {item} was delivered there before and is delivered by no unit of it, nor by one that the repair brought the delivery to in an earlier checkpoint"
"judge.free.unit_later" = "{unit} moves to {now}, a later checkpoint than {was}"
"judge.free.unit_check_item" = "{unit} stays and no longer delivers {item}, which its check {check} proves"
"judge.free.no_delivery" = "{unit} delivers no item"
"judge.free.unknown_item" = "{unit} delivers {item}, which is no record of the design in force"
"judge.free.own_field" = "{unit} stays and its field {field} changes"
"judge.free.new_own_field" = "{unit} is added with the field {field}, which a new unit does not carry"
"judge.free.protected_added" = "{unit}: the protected path {path} (it overlaps {protected}) is added to a unit"
"judge.free.protected_taken" = "{unit}: the protected path {path} (it overlaps {protected}) is taken from a unit"
"judge.free.protected_removed" = "{unit}: the unit holds the protected path {path} (it overlaps {protected}) and is removed"
"judge.free.test_added" = "{unit}: the test file {path}, which a check in force names, is added to a unit"
"judge.free.test_taken" = "{unit}: the test file {path}, which a check in force names, is taken from a unit"

"cli.record.remove.not_unit.refused" = "remove {id}"
"cli.record.remove.not_unit.because" = "{id} is not a unit, and only a unit record leaves the plan by a removal"
"cli.record.remove.not_unit.do_this.1" = "Remove a unit only. A change to any other record goes through an amendment."
"cli.record.remove.not_unit.worked_when" = "`bf record remove` names a unit."
"cli.record.remove.no_record.refused" = "remove {id}"
"cli.record.remove.no_record.because" = "no record has the ID {id}"
"cli.record.remove.no_record.do_this.1" = "Use the ID of a unit that `bf record list --kind unit` shows."
"cli.record.remove.no_record.worked_when" = "`bf record get {id}` prints the unit."
"cli.record.remove.no_repair.refused" = "remove {id}"
"cli.record.remove.no_repair.because" = "no plan repair that is open names {id}"
"cli.record.remove.no_repair.do_this.1" = "Open a plan repair that names the unit: `bf amend open --repair {id}`."
"cli.record.remove.no_repair.worked_when" = "`bf amend open` printed an amendment that names {id}."
"cli.record.remove.started.refused" = "remove {id}"
"cli.record.remove.started.because" = "{id} is {state}: a unit that has started stays in the plan"
"cli.record.remove.started.do_this.1" = "Leave the unit in the plan, or wait for the human to decide."
"cli.record.remove.started.worked_when" = "`bf status` shows the unit as it was."
"cli.record.remove.named.refused" = "remove {id}"
"cli.record.remove.named.because" = "these records still name {id}: {records}"
"cli.record.remove.named.do_this.1" = "Change each of them so that it names another unit or none, then remove {id} again."
"cli.record.remove.named.worked_when" = "No record names {id}."
"cli.record.remove.done" = "removed {id}; the open repair {amend} lists it as removed until it is approved, and a withdrawal puts it back"
